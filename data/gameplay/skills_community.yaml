# Top Spin 4 skills, coach abilities and coach tiers as described publicly (community/press/official).
# Companion to docs/gameplay/community-reference.md. Compiled 2026-11-14 by research agent R1 from web
# search + fetch; most community pages were readable only as search-engine snippets (see the doc, s0).
#
# Fields:
#   name         in-game display name (confirmed against data/gameplay/traits_skills.yaml, StringTable.bin)
#   code         internal ability code from the repo's disc extraction (crc32 in traits_skills.yaml)
#   effect       short public description (paraphrase; quotes are short)
#   trigger      condition the description implies (for code search)
#   community    notable player opinions / meta notes
#   sources      list of {url, kind, confidence}; kind: official|press|community|single|repo
#   aliases      other names used publicly
# Confidence: H = several agreeing sources or matches in-game text; M = one good source; L = single poster/garbled.

coach_tiers:
  - tier: Bronze
    repo_level: 1
    attribute_bonus_points: 25
    notes: "Mostly XP bonuses early (10%/20% post-match XP, per-winner XP)."
    sources:
      - {url: "http://www.topspinsuperguides.com/topspin4.htm", kind: community, confidence: M, note: snippet}
      - {url: "https://www.destructoid.com/preview-top-spin-4-player-creator-career-more/", kind: press, confidence: H}
  - tier: Silver
    repo_level: 2
    attribute_bonus_points: 35
    notes: "Stronger attribute bonuses (e.g. +10 Power) and gameplay skills."
    sources:
      - {url: "http://www.topspinsuperguides.com/topspin4.htm", kind: community, confidence: M, note: snippet}
      - {url: "https://www.destructoid.com/preview-top-spin-4-player-creator-career-more/", kind: press, confidence: H}
  - tier: Gold
    repo_level: 3
    attribute_bonus_points: 50
    notes: "Largest bonuses and best skills; achievement 'Golden boy' = unlock all skills of a Gold coach."
    sources:
      - {url: "http://www.topspinsuperguides.com/topspin4.htm", kind: community, confidence: M, note: snippet}
      - {url: "https://notebooklover.pixnet.net/blog/post/44784757", kind: press, confidence: M}
coach_rules:
  - claim: "Max +15 to any single attribute from a coach."
    sources: [{url: "http://www.topspinsuperguides.com/topspin4.htm", kind: community, confidence: M, note: snippet}]
  - claim: "Coach pool depends on how career levels were allocated across the three styles."
    sources: [{url: "https://www.destructoid.com/preview-top-spin-4-player-creator-career-more/", kind: press, confidence: H}]
  - claim: "Bonuses/skills unlock by completing coach objectives (e.g. '10 aces against your coach')."
    sources: [{url: "https://gamespot.com/articles/top-spin-4-first-impressions/1100-6286632/", kind: press, confidence: M, note: snippet}]
  - claim: "One active coach; switching loses the former coach's bonus (some reviews say learned skills are permanent: conflict)."
    sources:
      - {url: "https://www.gamereactor.eu/top-spin-4-preview/", kind: press, confidence: M}
      - {url: "https://www.videogamer.com/reviews/top-spin-4-review/", kind: press, confidence: M}
      - {url: "https://worthplaying.com/article/2011/3/23/reviews/80484-ps3x360-review-top-spin-4/", kind: press, confidence: M}
  - claim: "Pros have up to 3 skills, created players up to 2."
    sources: [{url: "https://www.mobygames.com/game/65583/top-spin-4/", kind: community, confidence: M, note: snippet}]
  - claim: "Coach skills apply online too."
    sources: [{url: "http://www.topspinsuperguides.com/topspin4.htm", kind: community, confidence: M, note: snippet}]
  - claim: "Repo count: 110 coaches = 20 level-1, 37 level-2, 53 level-3 (contradicts press counts of ~50/~100/30+)."
    sources: [{url: "data/gameplay/coaches_career.yaml", kind: repo, confidence: H}]

coach_only_abilities:
  - {name: "10% XP Bonus", code: GeneralXPBonus, effect: "Post-match XP +10%.", sources: [{url: "data/gameplay/coaches_career.yaml", kind: repo, confidence: H}, {url: "https://notebooklover.pixnet.net/blog/post/44784757", kind: press, confidence: M}]}
  - {name: "20% XP Bonus", code: GeneralMaxiXPBonus, effect: "Post-match XP +20% (e.g. coach Zheng Wei per superguide).", sources: [{url: "data/gameplay/coaches_career.yaml", kind: repo, confidence: H}, {url: "http://www.topspinsuperguides.com/topspin4.htm", kind: community, confidence: M, note: snippet}]}
  - {name: "Volley XP Bonus", code: VolleyXPBonus, effect: "Each winner at the net = bonus XP (5).", sources: [{url: "data/gameplay/coaches_career.yaml", kind: repo, confidence: H}, {url: "http://www.topspinsuperguides.com/topspin4.htm", kind: community, confidence: M, note: "snippet: '5 XP bonuses for net winners'"}]}
  - {name: "Baseline XP Bonus", code: BaselineXPBonus, effect: "Each winner at the baseline = bonus XP (3).", sources: [{url: "data/gameplay/coaches_career.yaml", kind: repo, confidence: H}]}
  - {name: "BONUS ATTRIBUTE", code: _AttributeBonus, effect: "Flat attribute increments, unlocked step by step.", sources: [{url: "data/gameplay/coaches_career.yaml", kind: repo, confidence: H}]}

skills:
  - name: Shot counter
    code: PowerfulShotCounter
    aliases: ["Shot Counter"]
    effect: "Use the power of the opponent's shot to counter with a well-timed Flat Finesse (tapped A)."
    trigger: "Flat + control(Finesse) tier + good timing + powerful incoming ball"
    community: "Chinese review: gives 'powerful counterpunches'."
    sources:
      - {url: "https://forum.lowyat.net/topic/1679805/+420", kind: community, confidence: H, note: snippet}
      - {url: "https://notebooklover.pixnet.net/blog/post/44784757", kind: press, confidence: M}
      - {url: "data/gameplay/traits_skills.yaml", kind: repo, confidence: H}
  - name: Return serve counter
    code: ReturnServeCounter
    effect: "Same as Shot counter but against the opponent's serve (well-timed Flat Finesse return)."
    trigger: "return of serve + Flat Finesse + good timing"
    community: "Only seen in name lists publicly."
    sources:
      - {url: "http://www.topspinsuperguides.com/topspin4.htm", kind: community, confidence: L, note: "snippet, name only"}
