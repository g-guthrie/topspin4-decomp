name: repository-guard

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/check_no_game_data.py
      - run: python3 tools/validate_decomp_dev_report.py
      - run: python3 -m unittest discover -s tests -v
