<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TS4 venue and crowd</title>
<link rel="stylesheet" href="css/style.css">
<style>
  #vpanel { position: absolute; top: 8px; left: 8px; width: 300px; max-width: calc(100vw - 32px); background: rgba(18,20,24,.88);
            color: #e8e8e8; font: 12px/1.4 system-ui, sans-serif; padding: 10px; border-radius: 6px; z-index: 2; }
  #vpanel h1 { font-size: 14px; margin: 0 0 6px; }
  #vpanel .row { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; align-items: center; }
  #vpanel button { font-size: 12px; padding: 2px 6px; }
  #vgauge { height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
  #vgauge > div { height: 100%; width: 30%; background: linear-gradient(90deg,#3a7bd5,#f5a623,#e94e3c); }
  #vlog { max-height: 160px; overflow: auto; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11px; color: #bbb; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  #vcanvas { display: block; width: 100vw; height: 100vh; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="vcanvas"></canvas>
<div id="vpanel">
  <h1>Venue and crowd</h1>
  <div class="row"><label>venue <select id="vVenue"></select></label> <button id="vLoad">load</button></div>
  <div class="row"><label>crowd <select id="vTier"><option value="0">low</option><option value="1">medium</option><option value="2" selected>high</option></select></label>
    <label><input type="checkbox" id="vTint" checked> tints</label> <span id="vCount"></span></div>
  <div class="row">excitement <span id="vLevel">0.30</span></div>
  <div id="vgauge"><div id="vGaugeBar"></div></div>
  <div class="row">
    <button data-ev="serve">serve</button><button data-ev="hit">hit</button><button data-ev="net">net cord</button>
    <button data-ev="fault">fault</button><button data-ev="ace">ace</button><button data-ev="winner">winner</button>
    <button data-ev="error">long-rally error</button><button data-ev="game">game</button>
  </div>
  <div class="row"><button id="vMatch">watch CPU match (core)</button> <label>speed <select id="vSpeed"><option>1</option><option>2</option><option>4</option></select></label></div>
  <div id="vStatus"></div>
  <div id="vlog"></div>
</div>
<script type="module" src="src/venue/venue_main.js"></script>
</body>
</html>
